/* Layout: one narrow column. Sticky search and filter chips on top, then a flat list of tappable rows. */

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0e16;
    --surface: #151a28;
    --ink: #eef1f8;
    --muted: #9099b0;
    --line: #262d44;
    --accent: #6aa8fb;
    --accent-soft: #1b2a4a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0e16;
  --surface: #151a28;
  --ink: #eef1f8;
  --muted: #9099b0;
  --line: #262d44;
  --accent: #6aa8fb;
  --accent-soft: #1b2a4a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 56px;
  min-height: 100vh;
}
.wrap { max-width: 720px; margin: 0 auto; }
header { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 8vw, 52px); line-height: 1.02; margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
.sub { color: var(--muted); margin: 0; max-width: 52ch; }
.controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.search { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.search:focus-visible, .chip:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 14px; font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.count { font-size: 14px; color: var(--muted); margin: 0 0 8px; font-variant-numeric: tabular-nums; }
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; color: inherit; text-decoration: none; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row:hover { background: var(--accent-soft); }
.row .txt { min-width: 0; }
.co { font-weight: 600; }
.role { color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
.go { flex: none; font-size: 14px; font-weight: 600; color: var(--accent); }
.empty { padding: 28px 16px; color: var(--muted); text-align: center; }
</style>
</head>

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderChips() {
  chipsEl.innerHTML = AREAS.map(function (a, i) {
    return '<button type="button" class="chip" data-i="' + i + '" aria-pressed="' + (i === state.area) + '">' + esc(a[0]) + "</button>";
  }).join("");
}

function render() {
  var area = AREAS[state.area][1];
  var q = state.q.trim().toLowerCase();
  var rows = DATA.filter(function (r) {
    var hay = r[0] + " " + r[1];
    if (area && !area.test(r[1])) return false;
    if (q && hay.toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  countEl.textContent = rows.length + (rows.length === 1 ? " posting" : " postings");
  if (!rows.length) {
    listEl.innerHTML = '<div class="empty">No postings match. Try a different word or filter.</div>';
    return;

  }).join("");
}
